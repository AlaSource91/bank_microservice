  # ═══════════════════════════════════════════════════════════════════════
  # Workflow Orchestration (Conductor)
  # ═══════════════════════════════════════════════════════════════════════

  # Conductor PostgreSQL Database
  conductor-postgres:
    image: postgres:15-alpine
    container_name: conductor-postgres
    environment:
      POSTGRES_DB: conductor
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor123
    ports:
      - "5432:5432"
    volumes:
      - conductor_postgres_data:/var/lib/postgresql/data
    networks:
      - bank-simulator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Conductor Server - Workflow Orchestration Engine
  conductor-server:
    image: conductoross/conductor-server:3.15.0
    container_name: conductor-server
    ports:
      - "8084:8080"  # Changed to avoid conflict with phpmyadmin
      - "5000:5000"  # Conductor UI
    environment:
      - CONFIG_PROP=config-postgres.properties
      - spring.datasource.url=jdbc:postgresql://conductor-postgres:5432/conductor
      - spring.datasource.username=conductor
      - spring.datasource.password=conductor123
      - conductor.grpc-server.port=8090
    depends_on:
      conductor-postgres:
        condition: service_healthy
    networks:
      - bank-simulator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Conductor UI - Workflow Management Interface
  conductor-ui:
    image: conductoross/conductor-ui:3.15.0
    container_name: conductor-ui
    ports:
      - "5001:5000"
    environment:
      - WF_SERVER=http://conductor-server:8080
    depends_on:
      - conductor-server
    networks:
      - bank-simulator-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # Observability Stack (Grafana, Prometheus, Loki, Zipkin)
  # ═══════════════════════════════════════════════════════════════════════

  # Zipkin - Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: p2p-zipkin
    ports:
      - "9411:9411"
    networks:
      - bank-simulator-net
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: p2p-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - bank-simulator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loki - Centralized Logging
  loki:
    image: grafana/loki:latest
    container_name: p2p-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    networks:
      - bank-simulator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail - Log Collector for Loki
  promtail:
    image: grafana/promtail:latest
    container_name: p2p-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - bank-simulator-net
    restart: unless-stopped
    depends_on:
      - loki

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: p2p-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - bank-simulator-net
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - zipkin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  bank-simulator-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  mongodb_data:
  mongodb_config:
  conductor_postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
