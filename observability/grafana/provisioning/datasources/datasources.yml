# ═══════════════════════════════════════════════════════════════════════
# Grafana Datasources Configuration
# ═══════════════════════════════════════════════════════════════════════
# Auto-provisions Prometheus, Loki, and Zipkin as datasources
# ───────────────────────────────────────────────────────────────────────

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Zipkin
    orgId: 1

datasources:
  # ═════════════════════════════════════════════════════════════════════
  # Prometheus - Metrics Data Source
  # ═════════════════════════════════════════════════════════════════════
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
    version: 1

  # ═════════════════════════════════════════════════════════════════════
  # Loki - Logs Data Source
  # ═════════════════════════════════════════════════════════════════════
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: '$${__value.raw}'
    version: 1

  # ═════════════════════════════════════════════════════════════════════
  # Zipkin - Distributed Tracing Data Source
  # ═════════════════════════════════════════════════════════════════════
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'loki'
        spanStartTimeShift: '1h'
        spanEndTimeShift: '-1h'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
    version: 1

